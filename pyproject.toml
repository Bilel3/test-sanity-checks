[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-logagent"
version = "0.1.0"
description = "Configurable AI-assisted sanity-check log analyzer"
requires-python = ">=3.11"
dependencies = [
  "Jinja2>=3.1,<4",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.20,<5",
]

[project.scripts]
logagent = "cli:main"

[tool.setuptools]
py-modules = ["cli", "models", "analyzer", "mailer"]

[tool.setuptools.packages.find]
include = ["parser*", "rules*", "ai*", "report*"]

[tool.pytest.ini_options]
testpaths = ["tests"]